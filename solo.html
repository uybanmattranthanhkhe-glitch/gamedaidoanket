<!DOCTYPE html><html lang="vi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Đại đoàn kết</title>
<style>
*{box-sizing:border-box}
body{margin:0;height:100vh;height:100dvh;background:radial-gradient(#1f5288,#0b1a2e);color:#fff;font-family:system-ui,"Segoe UI",sans-serif;overflow:hidden}
.hide{display:none!important}
.screen{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:16px;text-align:center;overflow:auto}
h1{margin:0;font-size:clamp(32px,6vw,64px);color:#f5c542;text-shadow:0 3px 0 #0007}
button{font:inherit;cursor:pointer;border:0;border-radius:14px}
.big{background:#f5c542;color:#12345a;font-weight:800;font-size:clamp(18px,3vw,28px);padding:12px 34px}
.row{display:flex;align-items:center;gap:14px;font-size:clamp(18px,2.6vw,28px)}
.sq{width:48px;height:48px;font-size:28px;background:#2d6aa5;color:#fff}
#names{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;width:min(720px,100%)}
input,select{font:inherit;padding:10px;border-radius:10px;border:0;width:100%}
select{width:auto}
#game{height:100%;display:flex}
#wrap{flex:1;min-width:0;min-height:0;display:grid;place-items:center;padding:8px}
#board{position:relative;background:url(nen.webp) center/contain no-repeat}
#tok{position:absolute;width:9.5%;transform:translate(-50%,-50%);filter:drop-shadow(0 3px 4px #000a)}
#spin{position:absolute;left:50%;top:50%;width:19%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;background:#fff;color:#12345a;font-weight:900;font-size:calc(var(--s)*.035);animation:pulse 1.4s infinite}
#spin:disabled{animation:none;opacity:.6}
@keyframes pulse{50%{box-shadow:0 0 0 14px #f5c54266}}
#side{width:28%;min-width:240px;padding:12px;display:flex;flex-direction:column;gap:10px;overflow:auto}
#turn{font-size:clamp(18px,2.4vw,30px);font-weight:800;color:#f5c542}
#score{display:grid;gap:6px}
.p{display:flex;justify-content:space-between;gap:8px;padding:8px 12px;border-radius:10px;background:#ffffff1f;font-size:clamp(14px,1.8vw,22px)}
.p.on{background:#f5c542;color:#12345a;font-weight:800}
#ov{position:fixed;inset:0;background:#000b;display:grid;place-items:center;padding:12px;z-index:9}
#card{width:min(94vw,900px);max-height:96vh;overflow:auto;background:#fff;color:#12345a;border-radius:20px;text-align:center;padding-bottom:16px}
#card .hd{color:#fff;font-weight:800;padding:10px;font-size:clamp(16px,2.4vw,26px)}
#card h2{margin:16px;font-size:clamp(20px,3.4vw,38px)}
#opts{display:grid;gap:10px;padding:0 16px}
@media(min-width:700px){#opts{grid-template-columns:1fr 1fr}}
.opt{background:#e8f0f9;color:#12345a;font-size:clamp(16px,2.6vw,30px);padding:14px;text-align:left}
.opt.ok{background:#2eb872;color:#fff}.opt.bad{background:#e0453a;color:#fff}
@media(orientation:portrait){#game{flex-direction:column}#side{width:100%;max-height:34%}}
</style></head><body>
<div id="setup" class="screen">
 <h1>🇻🇳 ĐẠI ĐOÀN KẾT</h1>
 <div class="row"><button class="sq" id="minus">−</button><span><b id="np">4</b> người chơi</span><button class="sq" id="plus">+</button></div>
 <div id="names"></div>
 <div class="row">Số vòng: <select id="rounds"><option>1</option><option>2</option><option>3</option><option>5</option></select></div>
 <button class="big" id="start">BẮT ĐẦU</button>
</div>
<div id="game" class="hide">
 <div id="wrap"><div id="board"><img id="tok" src="car.svg" alt=""><button id="spin">QUAY!</button></div></div>
 <div id="side"><div id="turn"></div><div id="score"></div></div>
</div>
<div id="ov" class="hide"><div id="card"></div></div>
<script src="questions.js"></script>
<script>
const $=s=>document.querySelector(s),Q=window.QUESTIONS,N=(window.CONFIG||{}).perTurn||10;
const NM={bac:"MIỀN BẮC",trung:"MIỀN TRUNG",nam:"MIỀN NAM"},COL={bac:"#e0679a",trung:"#e8872a",nam:"#2d8fd0"};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
let P=[],R=1,cur=0,round=1,ang=0,busy=false,decks={},np=4,qz;
function names(){const b=$("#names"),old=[...b.children].map(i=>i.value);b.innerHTML="";
 for(let i=0;i<np;i++){const e=document.createElement("input");e.maxLength=14;e.placeholder="Người chơi "+(i+1);e.value=old[i]||"";b.appendChild(e)}$("#np").textContent=np}
$("#minus").onclick=()=>{np=Math.max(2,np-1);names()};$("#plus").onclick=()=>{np=Math.min(10,np+1);names()};names();
$("#start").onclick=()=>{P=[...$("#names").children].map(i=>({n:i.value.trim()||i.placeholder,s:0}));R=+$("#rounds").value;cur=0;round=1;ang=0;
 $("#setup").classList.add("hide");$("#game").classList.remove("hide");fit();place(0);turn()};
function fit(){const w=$("#wrap").getBoundingClientRect(),s=Math.max(100,Math.min(w.width,w.height)-16),b=$("#board");
 b.style.width=b.style.height=s+"px";b.style.setProperty("--s",s+"px")}
addEventListener("resize",fit);
function place(a){const r=44.5,t=a*Math.PI/180;$("#tok").style.left=50+r*Math.sin(t)+"%";$("#tok").style.top=50-r*Math.cos(t)+"%";$("#tok").style.transform=`translate(-50%,-50%) rotate(${a}deg)`}
function board(){$("#score").innerHTML=P.map((p,i)=>`<div class="p ${i==cur?"on":""}"><span>${esc(p.n)}</span><b>${p.s}</b></div>`).join("")}
function turn(){busy=false;$("#spin").disabled=false;$("#turn").textContent=`Lượt: ${P[cur].n} · Vòng ${round}/${R}`;board()}
$("#spin").onclick=()=>{if(busy)return;busy=true;$("#spin").disabled=true;
 const a0=ang,d=360*(4+(Math.random()*3|0))+Math.random()*360,T=6000,t0=performance.now();
 (function f(n){const t=Math.min(1,(n-t0)/T);ang=a0+d*(1-Math.pow(1-t,3));place(ang);t<1?requestAnimationFrame(f):stop()})(t0)};
function show(h){$("#card").innerHTML=h;$("#ov").classList.remove("hide")}
function stop(){const a=ang%360,reg=a<60||a>=300?"bac":a<180?"trung":"nam";qz={reg,n:0,ok:0};
 show(`<div class="hd" style="background:${COL[reg]}">${esc(P[cur].n)}</div><h2>Dừng ở ${NM[reg]}!</h2>`);setTimeout(ask,1800)}
function ask(){const r=qz.reg;if(qz.n>=N)return done();
 if(!(decks[r]&&decks[r].length))decks[r]=shuf(Q[r]);
 const q=decks[r].pop(),o=shuf(q.a.map((t,i)=>({t,i})));qz.n++;
 show(`<div class="hd" style="background:${COL[r]}">${NM[r]} · Câu ${qz.n}/${N} · ${esc(P[cur].n)}</div><h2>${esc(q.q)}</h2><div id="opts">`+
  o.map((x,k)=>`<button class="opt" data-i="${x.i}">${"ABCD"[k]}. ${esc(x.t)}</button>`).join("")+"</div>");
 const bs=[...document.querySelectorAll(".opt")];
 bs.forEach(b=>b.onclick=()=>{bs.forEach(x=>{x.onclick=null;if(+x.dataset.i==q.c)x.classList.add("ok")});
  if(+b.dataset.i==q.c){P[cur].s++;qz.ok++}else b.classList.add("bad");board();setTimeout(ask,1500)})}
function done(){show(`<div class="hd" style="background:${COL[qz.reg]}">Kết thúc lượt</div><h2>${esc(P[cur].n)} trả lời đúng ${qz.ok}/${N} câu</h2><button class="big" id="nx">Tiếp tục</button>`);
 $("#nx").onclick=()=>{$("#ov").classList.add("hide");cur++;if(cur>=P.length){cur=0;round++}round>R?end():turn()}}
function end(){const s=[...P].sort((a,b)=>b.s-a.s),m=["🥇","🥈","🥉"];
 $("#game").classList.add("hide");const e=$("#setup");e.classList.remove("hide");
 e.innerHTML=`<h1>🏆 KẾT QUẢ</h1><div style="width:min(520px,100%);display:grid;gap:8px">`+
  s.map((p,i)=>`<div class="p ${p.s==s[0].s?"on":""}"><span>${m[i]||i+1+"."} ${esc(p.n)}</span><b>${p.s}</b></div>`).join("")+
  `</div><button class="big" onclick="location.reload()">CHƠI LẠI</button>`}
</script></body></html>
