<!DOCTYPE html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Đại đoàn kết - Admin</title><link rel="stylesheet" href="style.css"></head><body style="overflow:auto">
<div class="screen"><h1>⚙️ ĐIỀU KHIỂN</h1>
<div class="row">Số vòng: <select id="rounds"><option>1</option><option>2</option><option>3</option><option>5</option></select></div>
<div class="row"><button class="big" id="start">▶ BẮT ĐẦU</button><button class="big" id="turn">🎲 TẠO LƯỢT</button><button class="big" id="skip">⏭ BỎ LƯỢT</button><button class="big red" id="reset">🗑 XOÁ TẤT CẢ</button></div>
<div id="info" style="font-size:20px"></div><div id="score" style="width:min(520px,100%)"></div></div>
<script src="config.js"></script><script src="common.js"></script>
<script>
let K=sessionStorage.k||prompt("Mã admin:")||"";sessionStorage.k=K;
const act=async(a,x={})=>{const r=await api(a,{k:K,...x});S=r;if(r.err)alert(r.err);show()};
$("#start").onclick=()=>act("start",{rounds:$("#rounds").value});
$("#turn").onclick=()=>act("turn");$("#skip").onclick=()=>act("skip");
$("#reset").onclick=()=>confirm("Xoá toàn bộ người chơi và điểm?")&&act("reset");
function show(){if(!S||!S.players)return;renderScore();const t=S.turn;
 $("#info").innerHTML=`Trạng thái: <b>${S.status}</b> · Vòng: ${S.rounds} · Người chơi: ${S.players.length}<br>`+(t?`Lượt #${t.id}: <b>${esc(t.name)}</b> (${t.phase}) · câu ${t.n}/${S.per} · đúng ${t.ok}`:"Chưa có lượt")}
poll(show,2000);
</script></body></html>
