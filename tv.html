<!DOCTYPE html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Đại đoàn kết - TV</title><link rel="stylesheet" href="style.css">
<style>
  #welcome{
    position:fixed;inset:0;z-index:20;
    display:none;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;padding:24px;gap:10px;
    background:radial-gradient(circle at 50% 30%, #8a1111 0%, #4a0808 55%, #1a0303 100%);
  }
  #welcome img{width:clamp(120px,18vh,220px);height:clamp(120px,18vh,220px);
               object-fit:contain;filter:drop-shadow(0 8px 22px rgba(0,0,0,.6))}
  #welcome h1{margin:6px 0 0;color:#fff;
              font-size:clamp(22px,3.8vw,44px);
              text-shadow:0 2px 10px rgba(0,0,0,.65);letter-spacing:1px}
  #welcome .slogan{margin:6px 0 4px;color:#FFFF00;font-weight:700;
                   font-size:clamp(17px,3vw,36px);line-height:1.4}
  #welcome .slogan b{display:block;color:#FFFF00;font-size:inherit;margin-top:4px;
                     text-shadow:0 2px 8px rgba(0,0,0,.6)}
  #welcome #wj{margin-top:14px;color:#fff;
               font-size:clamp(14px,1.5vw,22px);line-height:1.6}
  #welcome #wj .url{color:#f5c542;word-break:break-all;font-weight:700}
  #welcome #wj .cnt{display:inline-block;min-width:2ch;color:#7CFC9B;font-weight:800}
</style>
</head><body>
<div id="welcome">
  <img src="icon.png" alt="Logo" onerror="this.style.display='none'">
  <h1>Game "Đại Đoàn Kết"</h1>
  <p class="slogan">NHIỆT LIỆT CHÀO MỪNG<b>NGÀY HỘI ĐẠI ĐOÀN KẾT TOÀN DÂN TỘC!</b></p>
  <div id="wj"></div>
</div>

<div id="app"><div id="wrap"><div id="board"><img id="car" src="car.svg" alt=""></div></div>
<div id="side"><h2 id="head"></h2><div id="info"></div><div id="score"></div></div></div>
<script src="config.js"></script><script src="common.js"></script>
<script>
S={players:[],turn:null,dur:6000};fit();
/* Xe chạy liên tục khi game đang chơi, không phụ thuộc dữ liệu quay từ server */
let ang=0,last=performance.now();const SPEED=90;/* độ/giây: 1 vòng ~4 giây */
(function f(now){const dt=(now-last)/1000;last=now;
 if(S&&S.status=="playing")ang=(ang+SPEED*dt)%360;
 const t=ang*Math.PI/180,c=$("#car");
 c.style.left=50+46.5*Math.sin(t)+"%";c.style.top=50-46.5*Math.cos(t)+"%";
 c.style.transform=`translate(-50%,-50%) rotate(${ang}deg)`;requestAnimationFrame(f)})(last);

const joinURL=location.href.replace(/tv\.html.*/,"");
poll(()=>{});
setInterval(()=>{
  if(!S.status)return;renderScore();
  const t=S.turn,h=$("#head"),i=$("#info"),w=$("#welcome");

  /* ===== LOBBY: hiện màn hình chào mừng với logo + khẩu hiệu ===== */
  if(S.status=="lobby"){
    w.style.display="flex";
    $("#wj").innerHTML=`Mở trên điện thoại:<br><span class="url">${esc(joinURL)}</span>`+
                       `<br>Đã vào: <span class="cnt">${S.players.length}</span>`;
    return;
  }
  /* Đã bắt đầu → ẩn màn hình chào mừng */
  if(w.style.display!="none")w.style.display="none";

  if(S.status=="ended"){h.textContent="🏆 KẾT QUẢ";i.textContent="Chào mừng tham gia trò chơi Đại Đoàn Kết!!";return}
  if(S.mode=="all"){
    const g={bac:[],trung:[],nam:[]},N=S.players.length;let sp=0,dn=0;
    S.players.forEach(p=>{const o=S.pl&&S.pl[p.id];if(!o)return;sp++;if(o.n>=S.per)dn++;if(spinDone(S,o))g[o.region].push(p.name)});
    h.textContent=!t?"🎉 Đã bắt đầu!":!spinDone(S)?"🚗 "+t.name+" đang quay…":"🎯 "+t.name+" đến "+NM[t.region];
    i.innerHTML=(!sp?"Mọi người bấm QUAY trên điện thoại":"")+Object.keys(g).map(r=>g[r].length?`<div style="color:${COL[r]}"><b>${NM[r]}</b>: <span style="color:#fff">${g[r].map(esc).join(", ")}</span></div>`:"").join("")+`<div style="margin-top:6px">Đã quay: ${sp}/${N} · Đã xong: ${dn}/${N}</div>`;return}
  if(S.status=="playing"&&!t){h.textContent="🎉 Đã bắt đầu!";i.textContent="Chuẩn bị lượt đầu tiên…";return}
  h.textContent="Lượt: "+t.name;
  if(t.phase=="ready")i.textContent="Chuẩn bị quay…";
  else if(!spinDone(S))i.textContent="🚗 Xe đang chạy…";
  else if(t.phase=="done")i.innerHTML=`${esc(t.name)} đúng <b>${t.ok}/${S.per}</b> câu`;
  else i.innerHTML=`<span style="color:${COL[t.region]};font-size:1.5em">${NM[t.region]}</span><br>Câu ${Math.min(t.n+1,S.per)}/${S.per} · đúng ${t.ok}`;
},500);
</script></body></html>
