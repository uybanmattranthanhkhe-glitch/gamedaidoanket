<!DOCTYPE html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Đại đoàn kết</title><link rel="stylesheet" href="style.css">
<style>
  #join{text-align:center;padding:24px 16px}
  #join .logo{width:120px;height:120px;object-fit:contain;display:block;margin:4px auto 6px;
              filter:drop-shadow(0 6px 14px rgba(0,0,0,.5))}
  #join h1{margin:6px 0 8px;color:#fff;font-size:clamp(19px,3.4vw,25px);line-height:1.2}
  #join .slogan{color:#FFFF00;font-size:clamp(18px,4vw,28px);line-height:1.4;margin:10px 0 20px;font-weight:700}
  #join .slogan b{color:#FFFF00;display:block;font-size:inherit;margin-top:4px;letter-spacing:0;font-weight:700}
</style>
</head><body>
<div id="join" class="screen">
  <img class="logo" src="icon.png" alt="Logo" onerror="this.style.display='none'">
  <h1>Game "Đại Đoàn Kết"</h1>
  <p class="slogan">NHIỆT LIỆT CHÀO MỪNG<b>NGÀY HỘI ĐẠI ĐOÀN KẾT TOÀN DÂN TỘC!</b></p>
  <input id="nm" maxlength="14" placeholder="Nhập tên của bạn">
  <button class="big" id="go">THAM GIA</button>
</div>
<div id="app" class="hide"><div id="wrap"><div id="board"><img id="car" src="car.svg" alt=""><button id="spin" disabled>QUAY!</button></div></div>
<div id="side"><div id="msg"></div><div id="score"></div></div></div>
<div id="ov" class="hide"><div id="card"></div></div>
<script src="config.js"></script><script src="questions.js"></script><script src="common.js"></script>
<script>
const Q=window.QUESTIONS;SRC=()=>S.mode=="all"?(S.pl&&S.pl[me]||null):S.turn;let me=localStorage.pid,quizOn=false,doneId=0,chain=Promise.resolve(),decks={};
function enter(){$("#join").classList.add("hide");$("#app").classList.remove("hide");fit();S={players:[],turn:null,dur:6000};loop();poll(onS)}
$("#go").onclick=async()=>{const r=await api("join",{name:$("#nm").value.trim()});if(r.err)return alert(r.err);me=r.me;localStorage.pid=me;enter()};
if(me)enter();
$("#spin").onclick=async()=>{$("#spin").disabled=true;S=await api(S.mode=="all"?"spinme":"spin",{pid:me});onS()};
function onS(){
 // ===== Bị admin xoá → tự thoát =====
 if((S.kicked&&S.kicked.indexOf(me)>=0)||(S.players&&!S.players.some(p=>p.id==me))){ try{localStorage.removeItem("pid")}catch(e){} alert("⚠️ Bạn đã bị quản trò xoá khỏi phòng chơi."); return location.reload(); }
 renderScore();const t=S.turn,m=S.players.find(p=>p.id==me);
 const all=S.mode=="all",o=all&&S.pl&&S.pl[me];
 if(all){$("#spin").disabled=!(S.status=="playing"&&!o);
  $("#msg").textContent=S.status=="ended"?"🏆 Kết thúc! Điểm của bạn: "+m.score:!o?(S.status=="playing"?"🎯 Bấm vào vòng tròn giữa để QUAY":"Chờ ban tổ chức bắt đầu…"):
   !spinDone(S,o)?"🚗 Xe đang chạy…":o.n<S.per?"Bạn đã đến "+NM[o.region]:`Bạn đúng ${o.ok}/${S.per} câu. Chờ mọi người…`;
  if(o&&spinDone(S,o)&&o.n<S.per&&!quizOn&&doneId!=1)quiz({id:1,region:o.region,n:o.n,banner:1});return}
 const mine=t&&t.pid==me;$("#spin").disabled=!(mine&&t.phase=="ready"&&S.status=="playing");
 $("#msg").textContent=S.status=="ended"?"🏆 Kết thúc! Điểm của bạn: "+m.score:!t?(S.status=="playing"?"✅ Đã bắt đầu! Chờ ban tổ chức tạo lượt…":"Chờ ban tổ chức bắt đầu…"):
  mine&&t.phase=="ready"?"🎯 Đến lượt bạn! Bấm vào vòng tròn giữa để QUAY":
  mine&&t.phase=="done"?`Bạn đúng ${t.ok}/${S.per} câu. Chờ lượt kế…`:mine?"Xe đang chạy…":"Đang chơi: "+t.name;
 if(mine&&(t.phase=="spin"||t.phase=="quiz")&&spinDone(S)&&!quizOn&&doneId!=t.id)quiz(t)}
function quiz(t){quizOn=true;let n=t.n;const r=t.region,per=S.per;
 function ask(){
  if(n>=per){doneId=t.id;quizOn=false;chain=chain.then(()=>new Promise(r=>setTimeout(r,5000))).then(()=>api("next",{tid:t.id})).then(s=>{S=s;onS()}).catch(()=>{});return $("#ov").classList.add("hide")}
  if(!(decks[r]&&decks[r].length))decks[r]=shuf([...Q[r],...Q.chung]);
  const q=decks[r].pop(),o=shuf(q.a.map((x,i)=>({x,i})));
  $("#card").innerHTML=`<div class="hd" style="background:${COL[r]}">${NM[r]} · Câu ${n+1}/${per}</div><h2>${esc(q.q)}</h2><div id="opts">`+
   o.map((y,k)=>`<button class="opt" data-i="${y.i}">${"ABCD"[k]}. ${esc(y.x)}</button>`).join("")+"</div>";
  $("#ov").classList.remove("hide");
  const bs=[...document.querySelectorAll(".opt")];
  bs.forEach(b=>b.onclick=()=>{const good=+b.dataset.i==q.c;
   bs.forEach(x=>{x.onclick=null;if(+x.dataset.i==q.c)x.classList.add("ok")});if(!good)b.classList.add("bad");
   chain=chain.then(()=>api("ans",{pid:me,ok:good?1:0})).then(s=>{S=s;onS()}).catch(()=>{});
   n++;setTimeout(ask,1300)})}
 if(t.banner){$("#card").innerHTML=`<div class="hd" style="background:${COL[r]}">Kết quả quay</div><img src="${r}.webp" alt="" style="display:block;margin:0 auto 8px;max-height:200px;max-width:100%" onerror="this.remove()"><h2>Bạn đã đến<br><span style="color:${COL[r]}">${NM[r]}</span> 🎉</h2>`;$("#ov").classList.remove("hide");setTimeout(ask,2500)}else ask()}
</script></body></html>
